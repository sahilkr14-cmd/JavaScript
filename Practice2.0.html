<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Lower to Uppercase </h2><br>

    <input type="text" id="name" placeholder="Enter Name">
    <input type="button" value="Convert" onclick="uppercase()">
    <p id="result"></p>
    <script>
        function uppercase() {
            let upper = document.getElementById("name").value

            let a = upper.toUpperCase()

            document.getElementById("result").innerText = a
        }

    </script>

</body>

</html>
