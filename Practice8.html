<!-- Print Student Names With Array -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>Student Names</h3>
    <ul id="student"></ul>

    <script>
        let students = ["Ravi", "Ishaan", "Rahul", "Gaurav"]

        students.forEach(function (name) {
            let li = document.createElement("li")
            li.innerText = name
            document.getElementById("student").appendChild(li)
        })
    </script>
</body>

</html>
