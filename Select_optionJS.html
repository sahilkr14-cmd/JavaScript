<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <select onchange="show(this.value)">

    <option value="">Select Cars</option>
    <option value="BMW">BMW</option>
    <option value="Mercedes">Mercedes</option>
    <option value="G-Wagon">G-Wagon</option>
  </select>
  <p id="result"></p>

  <script>
    function show(Cars) {
      document.getElementById("result").innerText = "Select : " + Cars
    }


  </script>
</body>

</html>
